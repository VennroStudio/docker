name: vennro

services:
  registry-ui:
    image: joxit/docker-registry-ui:latest
    container_name: registry-ui-container
    restart: unless-stopped
    environment:
      - NGINX_PROXY_PASS_URL=http://registry-container:5000
      - REGISTRY_AUTH=true
      - REGISTRY_TITLE=Vennro Private Registry
      - DELETE_IMAGES=true
    ports:
      - "${REGISTRY_UI_PORT:-5081}:80"
    networks:
      - proxy

networks:
  proxy:
    external: true
