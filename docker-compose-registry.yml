name: vennro

services:
  registry:
    image: registry:2
    container_name: registry-container
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./docker/${ENV}/registry/data:/var/lib/registry
      - ./docker/${ENV}/registry/auth:/auth
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: "Vennro Private Registry"
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    networks:
      - proxy
networks:
  proxy:
    external: true
