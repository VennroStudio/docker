---
- name: Setup Docker Infrastructure on Production Server
  hosts: production
  become: true

  vars:
      docker_repo: "{{ REPO_URL | default('https://github.com/VennroStudio/docker.git') }}"
      docker_dest: "{{ REMOTE_PATH | default('/home/' ~ ansible_user ~ '/infrastructure') }}"
      docker_branch: "{{ REPO_BRANCH | default('main') }}"
      docker_force: "{{ GIT_FORCE | default(false) | bool }}"
      remote_make_target: "{{ REMOTE_MAKE_TARGET | default('init') }}"

  tasks:
      # ========================================
      # БЛОК 1: УСТАНОВКА ЗАВИСИМОСТЕЙ И DOCKER НА СЕРВЕР
      # ========================================

      - name: Update apt cache
        ansible.builtin.apt:
            update_cache: true
            cache_valid_time: 3600
        tags: [setup]

      - name: Install system dependencies
        ansible.builtin.apt:
            name:
                - curl
                - ca-certificates
                - gnupg
                - software-properties-common
                - apt-transport-https
                - git
                - apache2-utils
                - make
            state: present
        tags: [setup]

      - name: Create keyrings directory
        ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: '0755'
        tags: [setup]

      - name: Add Docker GPG key
        ansible.builtin.apt_key:
            url: https://download.docker.com/linux/ubuntu/gpg
            keyring: /etc/apt/keyrings/docker.gpg
            state: present
        tags: [setup]

      - name: Add Docker repository
        ansible.builtin.apt_repository:
            repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
            state: present
            filename: docker
        tags: [setup]

      - name: Install Docker packages
        ansible.builtin.apt:
            name:
                - docker-ce
                - docker-ce-cli
                - containerd.io
                - docker-compose-plugin
            state: present
            update_cache: true
        tags: [setup]

      - name: Start Docker service
        ansible.builtin.systemd:
            name: docker
            state: started
            enabled: true
        tags: [setup]

      - name: Add user to docker group
        ansible.builtin.user:
            name: "{{ ansible_user }}"
            groups: docker
            append: true
        tags: [setup]

      # ========================================
      # БЛОК 2: КЛОНИРОВАНИЕ РЕПОЗИТОРИЯ
      # ========================================

      - name: Clone docker infrastructure repository
        ansible.builtin.git:
            repo: "{{ docker_repo }}"
            dest: "{{ docker_dest }}"
            version: "{{ docker_branch }}"
            force: "{{ docker_force }}"
        become_user: "{{ ansible_user }}"
        tags: [deploy]

      # ========================================
      # БЛОК 3: ЗАПУСК DOCKER COMPOSE
      # ========================================

      - name: Login to Docker Hub
        ansible.builtin.shell: |
            echo {{ DOCKERHUB_PASSWORD | quote }} | docker login -u {{ DOCKERHUB_USERNAME | quote }} --password-stdin
        args:
            executable: /bin/bash
        become_user: "{{ ansible_user }}"
        tags: [deploy]
        no_log: true
        when:
            - (DOCKERHUB_USERNAME | default('') | string | length) > 0
            - (DOCKERHUB_PASSWORD | default('') | string | length) > 0

      - name: Run infrastructure make target
        ansible.builtin.command:
            cmd: "make {{ remote_make_target }}"
            chdir: "{{ docker_dest }}"
        become_user: "{{ ansible_user }}"
        tags: [deploy]
        register: make_result

      - name: Display make initialization output
        ansible.builtin.debug:
            msg: "{{ make_result.stdout_lines }}"
        tags: [deploy]
        when: make_result.stdout_lines is defined
